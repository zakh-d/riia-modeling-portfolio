<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariia Ivanova &mdash; Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="hero-media">
    <img src="images/hero/IMG_3178.jpg" alt="Mariia Ivanova" class="hero-img">
    <div class="hero-overlay"></div>
  </div>
  <div class="hero-content">
    <h1>Riia</h1>
    <a class="social-link" href="https://www.instagram.com/crazy_about_serials/reels/?locale=English&amp;hl=en" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"></rect>
        <circle cx="12" cy="12" r="4.6"></circle>
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"></circle>
      </svg>
      <span>Instagram</span>
    </a>
  </div>
</header>

<main class="gallery" id="gallery"></main>

<footer>
  &copy; 2026 &mdash; All images property of the model.
</footer>

<div class="lightbox" id="lightbox">
  <div class="lightbox-bar">
    <span class="counter" id="counter"></span>
    <div>
      <a id="original-link" href="#" target="_blank" rel="noopener">View original</a>
      <button class="icon-btn" id="close-btn" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="lightbox-stage" id="lightbox-stage">
    <div class="spinner"></div>
    <button class="nav-btn nav-prev" id="prev-btn" aria-label="Previous">&#8249;</button>
    <img id="lightbox-img" alt="">
    <button class="nav-btn nav-next" id="next-btn" aria-label="Next">&#8250;</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
